<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的星空探索</title>
    <style>
        /* 基础重置与排版 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            cursor: crosshair;
        }

        /* 随机生成的背景星星动画 */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.2); }
        }

        /* 核心视觉：玻璃拟物化卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 480px;
            width: 90%;
            z-index: 10;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .glass-card:hover {
            transform: translateY(-10px) scale(1.02);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #e94560, #4a00e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
        }
        p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #d1d1d1;
            margin-bottom: 2.5rem;
        }

        /* 互动按钮样式 */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
            background: rgba(233, 69, 96, 0.85);
            border-radius: 30px;
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn:hover {
            background: rgba(233, 69, 96, 1);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(233, 69, 96, 0.4);
        }

        /* 鼠标跟随发光圆晕 */
        .cursor-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(74, 0, 224, 0.15) 0%, rgba(0,0,0,0) 60%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: top 0.1s ease-out, left 0.1s ease-out;
        }
    </style>
</head>
<body>
    <div class="cursor-glow" id="glow"></div>
    
    <div class="stars" id="stars-container"></div>

    <div class="glass-card">
        <h1 id="dynamic-title">你好，旅行者</h1>
        <p>这是一个独一无二的数字空间。每次刷新，背后的星海都为你重新排列。滑动鼠标感受光影，点击下方按钮开启奇遇。</p>
        <a href="#" class="btn" id="action-btn">互动一下</a>
    </div>

    <script>
        // 1. 鼠标跟随光晕逻辑
        const glow = document.getElementById('glow');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // 2. 独一无二的星空生成器
        const starsContainer = document.getElementById('stars-container');
        const starCount = 120; // 星星数量

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            // 每次生成随机坐标
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            
            // 随机大小，增加层次感
            const size = Math.random() * 2.5 + 0.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            
            // 随机闪烁频率与延迟，让星空更自然
            star.style.animationDuration = Math.random() * 4 + 2 + 's';
            star.style.animationDelay = Math.random() * 3 + 's';
            
            starsContainer.appendChild(star);
        }

        // 3. 按钮点击彩蛋逻辑
        const btn = document.getElementById('action-btn');
        const title = document.getElementById('dynamic-title');
        const messages = ["探索未知", "保持好奇", "灵感涌现", "再点一次试试?", "你好，旅行者"];
        let clickCount = 0;

        btn.addEventListener('click', (e) => {
            e.preventDefault();
            clickCount++;
            title.innerText = messages[clickCount % messages.length];
            
            // 点击生成波纹特效
            const ripple = document.createElement('div');
            ripple.style.position = 'fixed';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            ripple.style.width = '20px';
            ripple.style.height = '20px';
            ripple.style.background = 'transparent';
            ripple.style.border = '2px solid rgba(233, 69, 96, 0.8)';
            ripple.style.borderRadius = '50%';
            ripple.style.transform = 'translate(-50%, -50%)';
            ripple.style.transition = 'all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1)';
            ripple.style.zIndex = '9999';
            ripple.style.pointerEvents = 'none';
            document.body.appendChild(ripple);

            // 触发波纹扩散动画
            requestAnimationFrame(() => {
                ripple.style.width = '300px';
                ripple.style.height = '300px';
                ripple.style.opacity = '0';
            });

            // 清理 DOM
            setTimeout(() => {
                ripple.remove();
            }, 600);
        });
    </script>
</body>
</html>
